<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Plantilla de la página 404. La procesa siteUrlPlugin (vite.config.ts)
         al compilar: sustituye %SITE_URL%, %CSP%, %PHONE% y %PHONE_DISPLAY% y
         la publica como dist/404.html. GitHub Pages la sirve con código 404
         para cualquier ruta que no exista, a cualquier profundidad: por eso
         los enlaces son absolutos. Es autónoma (estilos en línea y fuentes del
         sistema) porque no carga el CSS ni el JS de la web. -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Página no encontrada – Carnicería Raúl Oliver</title>
    <link rel="icon" type="image/png" sizes="32x32" href="%SITE_URL%/favicon-32.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        padding: 3rem 1.5rem;
        background:
          radial-gradient(circle at 50% 30%, rgba(200, 151, 58, 0.12), transparent 60%),
          #0f0f0f;
        color: #ffffff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .brand { text-decoration: none; display: inline-flex; flex-direction: column; line-height: 1.15; }
      .brand-name { font-family: Georgia, 'Times New Roman', serif; font-size: 1.6rem; font-weight: 700; color: #ffffff; }
      .brand-sub { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #c8973a; margin-top: 2px; }
      .code { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(5rem, 18vw, 8rem); font-weight: 700; line-height: 1; color: #e74c3c; }
      .line { width: 70px; height: 3px; margin: 1.25rem auto; background: linear-gradient(90deg, #c8973a, #e8b84b); }
      h1 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; line-height: 1.2; }
      p { max-width: 460px; margin: 0.75rem auto 0; color: rgba(255, 255, 255, 0.75); }
      .actions { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0.9rem 2rem; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.05em;
        text-decoration: none; border: 2px solid transparent;
        transition: background 0.3s, border-color 0.3s, transform 0.3s;
      }
      .btn-primary { background: #c0392b; border-color: #c0392b; color: #ffffff; }
      .btn-primary:hover { background: #96281b; border-color: #96281b; transform: translateY(-2px); }
      .btn-outline { border-color: rgba(255, 255, 255, 0.6); color: #ffffff; }
      .btn-outline:hover { background: rgba(255, 255, 255, 0.12); border-color: #ffffff; transform: translateY(-2px); }
      :focus-visible { outline: 3px solid #c8973a; outline-offset: 3px; }
      @media (max-width: 480px) { .actions { flex-direction: column; width: 100%; max-width: 320px; } }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
    </style>
  </head>
  <body>
    <a class="brand" href="%SITE_URL%/">
      <span class="brand-name">Raúl Oliver</span>
      <span class="brand-sub">Carnicería · Charcutería</span>
    </a>

    <main>
      <div class="code" aria-hidden="true">404</div>
      <div class="line"></div>
      <h1>Esta página no existe</h1>
      <p>
        Puede que el enlace esté mal escrito o que la página ya no exista.
        Vuelve al inicio o llámanos si buscas algo en concreto.
      </p>
    </main>

    <div class="actions">
      <a class="btn btn-primary" href="%SITE_URL%/">Volver al inicio</a>
      <a class="btn btn-outline" href="tel:%PHONE%">Llamar al %PHONE_DISPLAY%</a>
    </div>
  </body>
</html>
